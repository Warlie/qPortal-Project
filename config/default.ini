; Base configuration — this file applies, it is not a sample.
; It holds the plugin registry ([short]) and every key the system needs.
; An installation adds config/config.ini for what differs; that file is laid
; over this one, so anything it does not mention stays inherited from here.
; Comments start with ';', as in php.ini

[runtime]
SERVER_URL = "__URL"
START_PAGE = "__SERVER_URLindex.php?i="
STD_URL = ""
CUR_PATH = ""
ROOT_DIR = "__DIR"
; Where this installation's own documents live. Ships pointing at the
; example; copy examples/ to program/ and set this to __ROOT_DIR/program
; in config.ini so updates never touch your content.
PROGRAM_DIR = "__ROOT_DIR/examples"
PLUG_IN_FOLDER = "__ROOT_DIR/PlugIn/"
; Das Vokabular des Registrierungsbogens. Gehoert zum SYSTEM, nicht zu dieser
; Installation - darum __ROOT_DIR wie PlugIn und nicht __PROGRAM_DIR. Das Dokument
; selbst liegt in ontologies/; hier steht nur, wo es liegt.
; ⚠ Fehlt die Datei, bricht der Aufbau ab. Absichtlich laut: ohne das Vokabular
;   praegt niemand, und use_ns_def_strict(true) WIRFT NICHT bei einem ungepraegten
;   Tag - die Seite rendert weiter, nur die Bedeutung waere weg.
REGISTRY_VOCABULARY = "__ROOT_DIR/ontologies/registry_surface.owl"
FRONTEND_INDEX = "__PROGRAM_DIR/main.xml"
EDIT_INDEX = "__PROGRAM_DIR/edit/edit.xml"
INTERN = "__PROGRAM_DIR/edit/intern.xml"

LANGUAGE_INPUT_DEFAULT = "XML"
LANGUAGE_OUTPUT_DEFAULT = "XML"

; Comma-separated URL query param names. First is the navigation/path dim (i), rest are aspect dims (j, ...).
QUERY_PARAM = "i,j"
XML_CASE_FOLDING_DEFAULT = "0"
XML_SCHEMA_DEFAULT = "__PROGRAM_DIR/validation/main.xsd"

; Ignores an existing .pedl file and rebuilds it from the .php source, even when the
; stored pedl:hash still matches. Useful after changes to the generator itself and
; after updates. Leave false in normal operation - rebuilding costs a full file scan.
PEDL_FORCE_REBUILD = false

[database]

;db-conntection
URL = "localhost"
User = "root"
PWST = ""

;server
db_name = "qportal"

;encoding
; MySQL-Schreibweise, nicht die IANA-Schreibweise: "UTF-8" wird von
; mysqli->set_charset() abgelehnt und wirft seit PHP 8 eine Exception.
codeset = "utf8mb4"

[default]
;general
LANGUAGE_INPUT = "XML"
LANGUAGE_OUTPUT = "XML"

;xml
XML_CASE_FOLDING = 0

[error]
ERROR = E_ALL & ~E_NOTICE & ~E_WARNING & ~E_USER_WARNING
SHOW_ERRORS = false

[log]
active = false
path = "template/log.txt"
level = 5

[constants]
constant[] = ""

[todolog]
; Datenbank-Profil fuer api/to_do_log.php (STN).
; Leer = der Abschnitt [database] selbst, sonst dessen ext.<profile>.*-Zeilen.
profile = ""

