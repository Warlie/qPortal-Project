[connection]
; Verbindungsprofile — eine Gegenstelle unter einem Namen.
;
; Ein Profil beantwortet immer dieselben vier Fragen, gleich was dahinter steht:
;   type     Wie wird geredet? Die Plattform: "qportal", "fuseki", "mysql".
;   address  Mit wem? LEER HEISST: diese Instanz bzw. localhost.
;   source   Worin? Der benannte Behaelter auf der Gegenseite.
;   user / password / verify_ssl   Darf ich?
;
; Die "source" ist bei jeder Plattform dieselbe Ebene, nur anders benannt:
;   mysql   : Server (address) -> Datenbank (source)   -> Tabelle
;   fuseki  : Server (address) -> Datensatz (source)   -> benannter Graph
;   qportal : Instanz (address)-> Baum (source)        -> Teilbaum
;
; Der Name links vom Punkt ist der Profilname, unter dem das Profil gerufen wird.
; Passwoerter gehoeren NICHT hierher, sondern in config/config.ini.

; Diese Instanz selbst. Ohne Adresse, weil sie hier laeuft — mit Adresse waere es
; eine zweite qPortal-Instanz nebenan, bei gleichem Typ.
qportal.type    = "qportal"
qportal.address = ""
qportal.source  = ""

; Ein SPARQL-Endpunkt. Fuseki bedient jeden Datensatz unter eigener URL
; (http://host:3030/<datensatz>/query), darum steht der Datensatz in der Adresse
; und "source" ist der benannte Graph darin — er geht als default-graph-uri mit,
; so sieht das Protokoll die Einschraenkung vor und der Ausdruck bleibt unberuehrt.
; Ein lokal laufender Fuseki ist derselbe Typ mit localhost-Adresse.
fuseki.type       = "fuseki"
fuseki.address    = ""
fuseki.source     = ""
fuseki.user       = ""
fuseki.password   = ""
; Nur abschalten, wenn der Endpunkt ein selbstsigniertes Zertifikat traegt.
fuseki.verify_ssl = true

[search]
; Suchmodelle (classes/search_model/). Jedes Modell liegt in einem eigenen
; Unterverzeichnis und meldet sich selbst an; hier steht nur, WORIN es sucht.
;
; Das sparql-Modell fragt nicht "welche Quelle", sondern "welche Gegenstelle":
; SPARQL ist eine Sprache, keine Gegenstelle. Wer sie spricht, steht als
; Verbindungsprofil im Abschnitt [connection] — dort auch, ob die Gegenstelle
; lokal oder entfernt ist. Hier steht nur, welches Profil ohne ausdrueckliche
; Angabe gilt; ein Aufruf ueberschreibt es mit use_source().
sparql.use = ""

[security]
; AES encryption for external position stamps
; cipher: AES-256-CBC (requires 32-byte key, 16-byte IV)
cipher = "AES-256-CBC"
; Set a 32-byte hex-encoded key in config.ini — never commit a real key here
stamp_key = ""

[intern]
; Bearer tokens for the __intern endpoint — add real tokens in config.ini only
key[] = ""